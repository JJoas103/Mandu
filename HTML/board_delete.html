<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>board_delete</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <!-- 헤더 -->
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">솔데스크</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="board_info.html">마이페이지</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="member_login.html">로그아웃</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="member_login.html">로그인</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="member_join.html">회원가입</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- 메인 -->
    <main class="container my-4">
      <article class="card shadow-sm">
        <div class="card-body p-4">
          <h4 class="mb-2">게시글 삭제</h4>
          <div class="text-muted small mb-3">게시글을 삭제하려면 비밀번호를 입력하세요.</div>

          <!-- 안내 카드 -->
          <div class="alert alert-warning small" role="alert">삭제 시 되돌릴 수 없습니다. 정말 삭제하시겠습니까?</div>

          <!-- 삭제 폼 -->
          <form action="feed/delete" method="post" class="mt-3">
            <div class="mb-3">
              <label for="password" class="form-label">비밀번호</label>
              <div class="input-group">
                <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호를 입력하세요" required />
                <!-- <button class="btn btn-outline-secondary" type="button" id="togglePw">표시</button> -->
              </div>
              <!-- 서버에서 실패 시 에러 메시지 바인딩 -->
              <div class="form-text text-danger">비밀번호가 일치하지 않습니다</div>
            </div>

            <div class="mt-4 d-flex gap-2">
              <a class="btn btn-outline-secondary" href="board_list.html">취소</a>
              <button type="submit" class="btn btn-brand">삭제</button>
            </div>
          </form>
        </div>
      </article>
    </main>

    <footer class="py-5 mt-5">
      <div class="container text-center footer">
        <div class="small">© 2025 솔데스크 커뮤니티 게시판</div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
