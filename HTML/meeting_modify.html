<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>모임 수정 - 모여봄</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="css/style.css" rel="stylesheet">
</head>
<body>

	<!-- 헤더 -->
	<nav class="navbar navbar-expand-lg">
		<div class="container">
			<a class="navbar-brand" href="index.html">🌿 모여봄</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="nav">
				<ul class="navbar-nav me-auto">
					<li class="nav-item"><a class="nav-link" href="index.html">지도 탐색</a></li>
					<li class="nav-item"><a class="nav-link active" href="meeting_list.html">모임 게시판</a></li>
					<li class="nav-item"><a class="nav-link" href="feed_list.html">실시간 제보</a></li>
				</ul>
				<ul class="navbar-nav ms-auto">
					<li class="nav-item"><a class="nav-link" href="member_info.html">마이페이지</a></li>
					<li class="nav-item"><a class="nav-link" href="member_login.html">로그아웃</a></li>
					<li class="nav-item"><a class="nav-link" href="member_login.html">로그인</a></li>
					<li class="nav-item"><a class="nav-link" href="member_join.html">회원가입</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<!-- 메인 -->
	<main class="container my-4">
		<div class="row justify-content-center">
			<div class="col-lg-8">
				<div class="card shadow-sm">
					<div class="card-body p-4">
						<h4 class="mb-3">모임 수정</h4>

						<form action="/meeting/modify" method="post" enctype="multipart/form-data">
							<input type="hidden" name="meeting_id" value="${meeting.meeting_id}">

							<!-- 제목 -->
							<div class="mb-3">
								<label for="meeting_title" class="form-label">모임 제목 <span class="text-danger">*</span></label>
								<input type="text" id="meeting_title" name="meeting_title" class="form-control" value="연남동 산책 + 카페 탐방" required />
							</div>

							<!-- 장소 -->
							<div class="mb-3">
								<label for="place_id" class="form-label">장소 <span class="text-danger">*</span></label>
								<select id="place_id" name="place_id" class="form-select" required>
									<option value="1" selected>연남동 (마포구)</option>
									<option value="2">북촌 (종로구)</option>
									<option value="3">강남역 (강남구)</option>
									<option value="4">서래마을 (서초구)</option>
									<option value="5">잠실 (송파구)</option>
									<option value="6">서울숲 (성동구)</option>
								</select>
							</div>

							<!-- 소개글 -->
							<div class="mb-3">
								<label for="meeting_desc" class="form-label">소개글 <span class="text-danger">*</span></label>
								<textarea id="meeting_desc" name="meeting_desc" class="form-control" rows="5" required>연남동에서 산책하면서 조용한 카페 2~3곳을 둘러볼 예정입니다. 경의선 숲길 따라 천천히 걸으면서 이야기 나누고, 커피 한 잔 하실 분 환영해요!</textarea>
							</div>

							<!-- 일시 + 인원 -->
							<div class="row g-3 mb-3">
								<div class="col-md-6">
									<label for="meeting_date" class="form-label">모임 날짜</label>
									<input type="date" id="meeting_date" name="meeting_date" class="form-control" value="2025-04-16">
								</div>
								<div class="col-md-3">
									<label for="meeting_time" class="form-label">시간</label>
									<input type="time" id="meeting_time" name="meeting_time" class="form-control" value="15:00">
								</div>
								<div class="col-md-3">
									<label for="max_headcount" class="form-label">모집 인원</label>
									<input type="number" id="max_headcount" name="max_headcount" class="form-control" value="5" min="2" max="20">
								</div>
							</div>

							<!-- 태그 -->
							<div class="mb-3">
								<label class="form-label">태그</label>
								<div class="d-flex flex-wrap gap-2">
									<div class="form-check">
										<input class="form-check-input" type="checkbox" name="tags" value="주차가능" id="tag1" checked>
										<label class="form-check-label" for="tag1">주차 가능</label>
									</div>
									<div class="form-check">
										<input class="form-check-input" type="checkbox" name="tags" value="조용한카페" id="tag2" checked>
										<label class="form-check-label" for="tag2">조용한 카페</label>
									</div>
									<div class="form-check">
										<input class="form-check-input" type="checkbox" name="tags" value="반려동물" id="tag3">
										<label class="form-check-label" for="tag3">반려동물 동반</label>
									</div>
									<div class="form-check">
										<input class="form-check-input" type="checkbox" name="tags" value="야외활동" id="tag4">
										<label class="form-check-label" for="tag4">야외 활동</label>
									</div>
									<div class="form-check">
										<input class="form-check-input" type="checkbox" name="tags" value="2시간이내" id="tag7" checked>
										<label class="form-check-label" for="tag7">2시간 이내</label>
									</div>
								</div>
							</div>

							<!-- 이미지 -->
							<div class="mb-3">
								<label for="upload_file" class="form-label">첨부 이미지 변경</label>
								<input type="file" id="upload_file" name="upload_file" class="form-control" accept="image/*">
							</div>

							<!-- 제출 -->
							<div class="d-flex gap-2 mt-4">
								<button type="submit" class="btn btn-brand btn-lg">수정 완료</button>
								<a class="btn btn-outline-secondary btn-lg" href="meeting_info.html?meeting_id=1">취소</a>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</main>

	<footer class="py-4 mt-5">
		<div class="container text-center footer">
			<div class="small">© 2025 모여봄 · 1조 프로젝트</div>
		</div>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
