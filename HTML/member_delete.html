<!doctype html>
<html lang="ko">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>board_delete</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="css/style.css" rel="stylesheet">
</head>

<body>
	<!-- 헤더 -->
	<nav class="navbar navbar-expand-lg navbar-dark">
		<div class="container">
			<a class="navbar-brand" href="index.html">솔데스크</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="nav">
				<ul class="navbar-nav ms-auto">
					<li class="nav-item"><a class="nav-link" href="board_info.html">마이페이지</a></li>
					<li class="nav-item"><a class="nav-link" href="member_login.html">로그아웃</a></li>
					<li class="nav-item"><a class="nav-link" href="member_login.html">로그인</a></li>
					<li class="nav-item"><a class="nav-link" href="member_join.html">회원가입</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<!-- 메인 -->
	<main class="container my-4">
		<div class="row justify-content-center">
			<div class="col-md-7 col-lg-6">
				<div class="card shadow-sm">
					<div class="card-body p-4">
						<h4 class="mb-3">게시글 삭제</h4>
						<p class="text-muted mb-4">게시글을 삭제하려면 비밀번호를 입력하세요. 삭제 후에는 되돌릴 수 없습니다.</p>

						<form action="board/delete" method="post"
							onsubmit="return confirm('정말로 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.');">
							<!-- 글 식별자 hidden (프로젝트 필드명에 맞게 변경) -->
							<input type="hidden" name="board_id" value="${board.board_id}">
							<!-- Spring Security CSRF 사용 시 -->
							<input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}" />

							<div class="row g-3">
								<!-- 비밀번호 -->
								<div class="col-12">
									<label class="form-label">비밀번호 <span class="text-danger">*</span></label>
									<input type="password" class="form-control" name="password"
										placeholder="비밀번호를 입력하세요" id="deletePasswordInput" required />

									<!-- 서버 바인딩 에러 메시지 -->
									<div class="form-text text-danger">비밀번호가 일치하지 않습니다</div>

								</div>

								<div class="col-12 form-check">
									<input class="form-check-input" type="checkbox" id="showPwChk"
										onchange="togglePassword()">
									<label class="form-check-label" for="showPwChk">비밀번호 표시</label>
								</div>
							</div>

							<div class="d-grid mt-4 gap-2">
								<button type="submit" class="btn btn-brand">삭제하기</button>
								<a href="board/info?board_id=${board.board_id}" class="btn btn-outline-secondary">취소</a>
							</div>
						</form>
					</div><!-- /card-body -->
				</div><!-- /card -->
			</div>
		</div>
	</main>

	<footer class="py-5 mt-5">
		<div class="container text-center footer">
			<div class="small">© 2025 솔데스크 커뮤니티 게시판</div>
		</div>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
