<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>제보 상세 - 모여봄</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="/css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg">
	<div class="container">
		<a class="navbar-brand" href="/">🌿 모여봄</a>
		<div class="collapse navbar-collapse show">
			<ul class="navbar-nav me-auto">
				<li class="nav-item"><a class="nav-link" href="/">지도 탐색</a></li>
				<li class="nav-item"><a class="nav-link" href="/meeting">모임 게시판</a></li>
				<li class="nav-item"><a class="nav-link active" href="/feed">실시간 제보</a></li>
			</ul>
		</div>
	</div>
</nav>

<main class="container my-4">
	<div class="row justify-content-center">
		<div class="col-lg-8">

			<div id="feedDetail" class="card shadow-sm mb-4">
				<div class="card-body">제보 정보를 불러오는 중입니다...</div>
			</div>

			<div class="card shadow-sm mb-4">
				<div class="card-body">
					<h5 class="mb-3">댓글 작성</h5>
					<form action="/feed/comment" method="post">
						<input type="hidden" name="feed_id" id="commentFeedId">
						<textarea name="content" class="form-control mb-2" rows="3" placeholder="댓글을 입력하세요." required></textarea>
						<button type="submit" class="btn btn-brand">댓글 등록</button>
					</form>
				</div>
			</div>

			<div class="card shadow-sm">
				<div class="card-body">
					<h5 class="mb-3">댓글 목록</h5>
					<div id="commentList" class="d-flex flex-column gap-2">
						<div class="text-muted">댓글을 불러오는 중입니다...</div>
					</div>
				</div>
			</div>

			<div class="mt-3">
				<a href="/feed" class="btn btn-outline-secondary">목록으로</a>
			</div>

		</div>
	</div>
</main>

<footer class="py-4 mt-5">
	<div class="container text-center footer">
		<div class="small">© 2025 모여봄 · 1조 프로젝트</div>
	</div>
</footer>

<script>
	function getFeedId() {
		return new URLSearchParams(window.location.search).get('feed_id');
	}

	function formatDate(dateString) {
		const date = new Date(dateString);
		return date.toLocaleString('ko-KR');
	}

	function escapeHtml(text) {
		return String(text || '')
			.replaceAll('&', '&amp;')
			.replaceAll('<', '&lt;')
			.replaceAll('>', '&gt;')
			.replaceAll('"', '&quot;')
			.replaceAll("'", '&#039;');
	}

	async function loadFeedDetail() {
		const feedId = getFeedId();
		const detailEl = document.getElementById('feedDetail');
		const commentEl = document.getElementById('commentList');
		const commentFeedIdEl = document.getElementById('commentFeedId');

		if (!feedId) {
			detailEl.innerHTML = '<div class="card-body text-danger">제보 ID가 없습니다.</div>';
			return;
		}

		commentFeedIdEl.value = feedId;

		try {
			const response = await fetch(`/feed/api/${feedId}`);
			const result = await response.json();

			if (!result.success) {
				detailEl.innerHTML = '<div class="card-body text-danger">제보를 찾을 수 없습니다.</div>';
				return;
			}

			const feed = result.feed;
			const comments = result.comments || [];

			detailEl.innerHTML = `
				<div class="card-body">
					<div class="d-flex justify-content-between align-items-start mb-3">
						<div>
							<h4 class="mb-2">📡 ${escapeHtml(feed.place_name)} 제보</h4>
							<div class="text-muted small">
								작성자: ${escapeHtml(feed.writer_name)} · ${formatDate(feed.createdAt)}
							</div>
						</div>
						<span class="badge bg-success">${escapeHtml(feed.category)}</span>
					</div>

					<p class="fs-5">${escapeHtml(feed.content)}</p>

					<div class="mb-3">
						${feed.gps_verified ? '<span class="badge bg-primary">GPS 인증</span>' : ''}
						<span class="badge bg-secondary">댓글 ${feed.comment_count || 0}</span>
						<span class="badge bg-secondary">도움됐어요 ${feed.helpful_count || 0}</span>
					</div>

					<div class="d-flex gap-2">
						<form action="/feed/react" method="post">
							<input type="hidden" name="feed_id" value="${feed._id}">
							<button type="submit" class="btn btn-outline-brand">👍 도움됐어요</button>
						</form>
						<a href="/feed/modify?feed_id=${feed._id}" class="btn btn-outline-secondary">수정</a>
						<a href="/feed/delete?feed_id=${feed._id}" class="btn btn-outline-danger">삭제</a>
					</div>
				</div>
			`;

			if (comments.length === 0) {
				commentEl.innerHTML = '<div class="text-muted">아직 댓글이 없습니다.</div>';
				return;
			}

			commentEl.innerHTML = comments.map(comment => `
				<div class="border rounded p-3">
					<div class="small text-muted mb-1">
						${escapeHtml(comment.writer_name)} · ${formatDate(comment.createdAt)}
					</div>
					<div>${escapeHtml(comment.content)}</div>
				</div>
			`).join('');

		} catch (error) {
			console.error(error);
			detailEl.innerHTML = '<div class="card-body text-danger">서버 오류가 발생했습니다.</div>';
		}
	}

	loadFeedDetail();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
