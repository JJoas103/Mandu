<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>모임 삭제 - 모여봄</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="css/style.css" rel="stylesheet">
</head>
<body>

	<!-- 헤더 -->
	<nav class="navbar navbar-expand-lg">
		<div class="container">
			<a class="navbar-brand" href="index.html">🌿 모여봄</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="nav">
				<ul class="navbar-nav me-auto">
					<li class="nav-item"><a class="nav-link" href="index.html">지도 탐색</a></li>
					<li class="nav-item"><a class="nav-link active" href="meeting_list.html">모임 게시판</a></li>
					<li class="nav-item"><a class="nav-link" href="feed_list.html">실시간 제보</a></li>
				</ul>
				<ul class="navbar-nav ms-auto">
					<li class="nav-item"><a class="nav-link" href="member_info.html">마이페이지</a></li>
					<li class="nav-item"><a class="nav-link" href="member_login.html">로그아웃</a></li>
					<li class="nav-item"><a class="nav-link" href="member_login.html">로그인</a></li>
					<li class="nav-item"><a class="nav-link" href="member_join.html">회원가입</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<main class="container my-4">
		<div class="row justify-content-center">
			<div class="col-md-7 col-lg-6">
				<div class="card shadow-sm">
					<div class="card-body p-4">
						<h4 class="mb-3">모임 삭제</h4>
						<p class="text-muted mb-4">모임을 삭제하면 참여자 목록도 함께 삭제되며, 되돌릴 수 없습니다.</p>

						<div class="alert alert-warning">
							<strong>⚠️ 주의</strong><br>
							<div class="mt-2">모임명: <strong>연남동 산책 + 카페 탐방</strong></div>
							<div>현재 참여자: <strong>2명</strong></div>
						</div>

						<form action="/meeting/delete" method="post"
							onsubmit="return confirm('정말로 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.');">

							<input type="hidden" name="meeting_id" value="${meeting.meeting_id}">

							<div class="mb-3">
								<label class="form-label">비밀번호 확인 <span class="text-danger">*</span></label>
								<input type="password" class="form-control" name="password" placeholder="비밀번호를 입력하세요" required>
								<div class="form-text text-danger">비밀번호가 일치하지 않습니다</div>
							</div>

							<div class="form-check mb-3">
								<input class="form-check-input" type="checkbox" id="showPwChk" onchange="togglePassword()">
								<label class="form-check-label" for="showPwChk">비밀번호 표시</label>
							</div>

							<div class="d-grid gap-2">
								<button type="submit" class="btn btn-outline-danger">삭제하기</button>
								<a href="meeting_info.html?meeting_id=1" class="btn btn-outline-secondary">취소</a>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</main>

	<footer class="py-4 mt-5">
		<div class="container text-center footer">
			<div class="small">© 2025 모여봄 · 1조 프로젝트</div>
		</div>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		function togglePassword() {
			const pw = document.querySelector('input[name="password"]');
			pw.type = pw.type === 'password' ? 'text' : 'password';
		}
	</script>
</body>
</html>
