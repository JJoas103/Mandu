<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>글쓰기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <!-- 헤더 -->
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">솔데스크</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="board_info.html">마이페이지</a></li>
            <li class="nav-item"><a class="nav-link" href="member_login.html">로그아웃</a></li>
            <li class="nav-item"><a class="nav-link" href="member_login.html">로그인</a></li>
            <li class="nav-item"><a class="nav-link" href="member_join.html">회원가입</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- 메인 -->
    <main class="container my-4">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h4 class="mb-3">게시글 작성</h4>
          <form action="/feed/write" method="post" enctype="multipart/form-data">
            <div>
              <select name="category" id="">
                <option value="">카테고리를 선택하세요</option>
                <option value="free">자유게시판</option>
                <option value="study">학업게시판</option>
                <option value="suggestion">건의게시판</option>
                <option value="counsel">상담게시판</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="board_title" class="form-label">제목</label>
              <input type="text" id="board_title" class="form-control" placeholder="제목을 입력하세요" />
            </div>
            <div class="mb-3">
              <label for="board_content" class="form-label">본문</label>
              <textarea name="board_content" class="form-control" rows="8" placeholder="내용을 입력하세요"></textarea>
            </div>
            <div class="mb-3">
              <label for="upload_file" class="form-label">첨부 이미지</label>
              <input type="file" class="form-control" name="upload_file" />
            </div>
            <div class="d-flex gap-2">
              <input type="submit" value="글쓰기" class="btn btn-brand" />
              <a class="btn btn-outline-secondary" href="board_list.html">취소</a>
            </div>
          </form>
        </div>
      </div>
    </main>

    <!-- 푸터 -->
    <footer class="py-5 mt-5">
      <div class="container text-center footer">
        <div class="small">© 2025 솔데스크 커뮤니티 게시판</div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
