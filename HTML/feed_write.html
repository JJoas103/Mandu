<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>제보하기 - 모여봄</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="/css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg">
	<div class="container">
		<a class="navbar-brand" href="/">🌿 모여봄</a>
		<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
			<span class="navbar-toggler-icon"></span>
		</button>

		<div class="collapse navbar-collapse" id="nav">
			<ul class="navbar-nav me-auto">
				<li class="nav-item"><a class="nav-link" href="/">지도 탐색</a></li>
				<li class="nav-item"><a class="nav-link" href="/meeting">모임 게시판</a></li>
				<li class="nav-item"><a class="nav-link active" href="/feed">실시간 제보</a></li>
			</ul>
			<ul class="navbar-nav ms-auto">
				<li class="nav-item"><a class="nav-link" href="/member/info">마이페이지</a></li>
				<li class="nav-item"><a class="nav-link" href="/member/login">로그인</a></li>
				<li class="nav-item"><a class="nav-link" href="/member/join">회원가입</a></li>
			</ul>
		</div>
	</div>
</nav>

<main class="container my-4">
	<div class="row justify-content-center">
		<div class="col-lg-8">
			<div class="card shadow-sm">
				<div class="card-body p-4">
					<h4 class="mb-1">📡 제보하기</h4>
					<p class="text-muted small mb-4">제보한 내용은 실시간 제보 목록에 반영됩니다.</p>

					<form action="/feed/write" method="post">
						<div class="mb-3">
							<label for="place_id" class="form-label">장소 태그 <span class="text-danger">* 필수</span></label>
							<select id="place_id" name="place_id" class="form-select" required>
								<option value="">장소를 선택하세요</option>
								<option value="1">연남동 (마포구)</option>
								<option value="2">북촌 (종로구)</option>
								<option value="3">강남역 (강남구)</option>
								<option value="4">서래마을 (서초구)</option>
								<option value="5">잠실 (송파구)</option>
								<option value="6">서울숲 (성동구)</option>
								<option value="7">성수동 (성동구)</option>
								<option value="8">익선동 (종로구)</option>
							</select>
						</div>

						<div class="mb-3">
							<label for="category" class="form-label">제보 카테고리 <span class="text-danger">*</span></label>
							<select id="category" name="category" class="form-select" required>
								<option value="">카테고리를 선택하세요</option>
								<option value="혼잡도">🚦 혼잡도</option>
								<option value="주차">🅿️ 주차 정보</option>
								<option value="맛집">🍜 맛집</option>
								<option value="날씨">🌤️ 날씨/현장</option>
								<option value="기타">💬 기타</option>
							</select>
						</div>

						<div class="mb-3">
							<label for="content" class="form-label">내용 <span class="text-danger">*</span></label>
							<textarea id="content" name="content" class="form-control" rows="6" placeholder="현장 상황을 적어주세요." required></textarea>
						</div>

						<div class="mb-3">
							<label for="upload_file" class="form-label">첨부 이미지</label>
							<input type="file" id="upload_file" name="upload_file" class="form-control" accept="image/*">
							<div class="form-text">현재 버전에서는 이미지 파일 저장은 제외됩니다.</div>
						</div>

						<div class="form-check mb-4">
							<input class="form-check-input" type="checkbox" name="gps_verified" value="1" id="gpsChk" checked>
							<label class="form-check-label" for="gpsChk">현재 위치 GPS 인증</label>
						</div>

						<div class="d-flex gap-2">
							<button type="submit" class="btn btn-brand btn-lg">제보하기</button>
							<a class="btn btn-outline-secondary btn-lg" href="/feed">취소</a>
						</div>
					</form>

				</div>
			</div>
		</div>
	</div>
</main>

<footer class="py-4 mt-5">
	<div class="container text-center footer">
		<div class="small">© 2025 모여봄 · 1조 프로젝트</div>
	</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
