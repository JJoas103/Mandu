<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>제보 수정 - 모여봄</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="css/style.css" rel="stylesheet">
</head>
<body>

	<!-- 헤더 -->
	<nav class="navbar navbar-expand-lg">
		<div class="container">
			<a class="navbar-brand" href="index.html">🌿 모여봄</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="nav">
				<ul class="navbar-nav me-auto">
					<li class="nav-item"><a class="nav-link" href="index.html">지도 탐색</a></li>
					<li class="nav-item"><a class="nav-link" href="meeting_list.html">모임 게시판</a></li>
					<li class="nav-item"><a class="nav-link active" href="feed_list.html">실시간 제보</a></li>
				</ul>
				<ul class="navbar-nav ms-auto">
					<li class="nav-item"><a class="nav-link" href="member_info.html">마이페이지</a></li>
					<li class="nav-item"><a class="nav-link" href="member_login.html">로그아웃</a></li>
					<li class="nav-item"><a class="nav-link" href="member_login.html">로그인</a></li>
					<li class="nav-item"><a class="nav-link" href="member_join.html">회원가입</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<!-- 메인 -->
	<main class="container my-4">
		<div class="row justify-content-center">
			<div class="col-lg-8">
				<div class="card shadow-sm">
					<div class="card-body p-4">
						<h4 class="mb-3">제보 수정</h4>

						<form action="/feed/modify" method="post" enctype="multipart/form-data">
							<input type="hidden" name="feed_id" value="${feed.feed_id}">

							<!-- 장소 태그 -->
							<div class="mb-3">
								<label for="place_id" class="form-label">장소 태그 <span class="text-danger">*</span></label>
								<select id="place_id" name="place_id" class="form-select" required>
									<option value="1" selected>연남동 (마포구)</option>
									<option value="2">북촌 (종로구)</option>
									<option value="3">강남역 (강남구)</option>
									<option value="4">서래마을 (서초구)</option>
									<option value="5">잠실 (송파구)</option>
								</select>
							</div>

							<!-- 카테고리 -->
							<div class="mb-3">
								<label for="category" class="form-label">카테고리</label>
								<select id="category" name="category" class="form-select">
									<option value="혼잡도" selected>🚦 혼잡도</option>
									<option value="주차">🅿️ 주차 정보</option>
									<option value="맛집">🍜 맛집</option>
									<option value="날씨">🌤️ 날씨/현장</option>
									<option value="기타">💬 기타</option>
								</select>
							</div>

							<!-- 본문 -->
							<div class="mb-3">
								<label for="content" class="form-label">내용</label>
								<textarea id="content" name="content" class="form-control" rows="6">경의선 숲길 쪽은 지금 한산해요. 벤치 자리도 많고 카페도 대기 없이 들어갈 수 있어요 ☀️

주차장은 연남동 공영주차장 지하 1층에 아직 10자리 이상 비어있습니다. 지금이 방문 타이밍!</textarea>
							</div>

							<!-- 이미지 -->
							<div class="mb-3">
								<label for="upload_file" class="form-label">첨부 이미지 변경</label>
								<input type="file" id="upload_file" name="upload_file" class="form-control" accept="image/*">
							</div>

							<!-- 제출 -->
							<div class="d-flex gap-2">
								<button type="submit" class="btn btn-brand btn-lg">수정 완료</button>
								<a class="btn btn-outline-secondary btn-lg" href="feed_info.html?feed_id=1">취소</a>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</main>

	<footer class="py-4 mt-5">
		<div class="container text-center footer">
			<div class="small">© 2025 모여봄 · 1조 프로젝트</div>
		</div>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
