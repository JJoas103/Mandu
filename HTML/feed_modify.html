<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>제보 수정 - 모여봄</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="/css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg">
	<div class="container">
		<a class="navbar-brand" href="/">🌿 모여봄</a>
	</div>
</nav>

<main class="container my-4">
	<div class="row justify-content-center">
		<div class="col-lg-8">
			<div class="card shadow-sm">
				<div class="card-body p-4">
					<h4 class="mb-4">제보 수정</h4>

					<form action="/feed/modify" method="post">
						<input type="hidden" name="feed_id" id="feed_id">

						<div class="mb-3">
							<label class="form-label">장소 태그</label>
							<select id="place_id" name="place_id" class="form-select" required>
								<option value="1">연남동 (마포구)</option>
								<option value="2">북촌 (종로구)</option>
								<option value="3">강남역 (강남구)</option>
								<option value="4">서래마을 (서초구)</option>
								<option value="5">잠실 (송파구)</option>
								<option value="6">서울숲 (성동구)</option>
								<option value="7">성수동 (성동구)</option>
								<option value="8">익선동 (종로구)</option>
							</select>
						</div>

						<div class="mb-3">
							<label class="form-label">제보 카테고리</label>
							<select id="category" name="category" class="form-select" required>
								<option value="혼잡도">🚦 혼잡도</option>
								<option value="주차">🅿️ 주차 정보</option>
								<option value="맛집">🍜 맛집</option>
								<option value="날씨">🌤️ 날씨/현장</option>
								<option value="기타">💬 기타</option>
							</select>
						</div>

						<div class="mb-3">
							<label class="form-label">내용</label>
							<textarea id="content" name="content" class="form-control" rows="6" required></textarea>
						</div>

						<div class="form-check mb-4">
							<input class="form-check-input" type="checkbox" name="gps_verified" value="1" id="gps_verified">
							<label class="form-check-label" for="gps_verified">현재 위치 GPS 인증</label>
						</div>

						<div class="d-flex gap-2">
							<button type="submit" class="btn btn-brand btn-lg">수정하기</button>
							<a id="cancelBtn" class="btn btn-outline-secondary btn-lg" href="/feed">취소</a>
						</div>
					</form>

				</div>
			</div>
		</div>
	</div>
</main>

<script>
	function getFeedId() {
		return new URLSearchParams(window.location.search).get('feed_id');
	}

	async function loadFeed() {
		const feedId = getFeedId();

		if (!feedId) {
			alert('제보 ID가 없습니다.');
			location.href = '/feed';
			return;
		}

		const response = await fetch(`/feed/api/${feedId}`);
		const result = await response.json();

		if (!result.success) {
			alert('제보를 찾을 수 없습니다.');
			location.href = '/feed';
			return;
		}

		const feed = result.feed;

		document.getElementById('feed_id').value = feed._id;
		document.getElementById('place_id').value = feed.place_id;
		document.getElementById('category').value = feed.category;
		document.getElementById('content').value = feed.content;
		document.getElementById('gps_verified').checked = !!feed.gps_verified;
		document.getElementById('cancelBtn').href = `/feed/info?feed_id=${feed._id}`;
	}

	loadFeed();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
