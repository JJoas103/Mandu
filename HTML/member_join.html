<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>회원가입 - 모여봄</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="css/style.css" rel="stylesheet">
</head>
<body>

	<!-- 헤더 -->
	<nav class="navbar navbar-expand-lg">
		<div class="container">
			<a class="navbar-brand" href="index.html">🌿 모여봄</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="nav">
				<ul class="navbar-nav me-auto">
					<li class="nav-item"><a class="nav-link" href="index.html">지도 탐색</a></li>
					<li class="nav-item"><a class="nav-link" href="meeting_list.html">모임 게시판</a></li>
					<li class="nav-item"><a class="nav-link" href="feed_list.html">실시간 제보</a></li>
				</ul>
				<ul class="navbar-nav ms-auto">
					<li class="nav-item"><a class="nav-link" href="member_info.html">마이페이지</a></li>
					<li class="nav-item"><a class="nav-link" href="member_login.html">로그아웃</a></li>
					<li class="nav-item"><a class="nav-link" href="member_login.html">로그인</a></li>
					<li class="nav-item"><a class="nav-link active" href="member_join.html">회원가입</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<main class="container my-4">
		<div class="row justify-content-center">
			<div class="col-md-7 col-lg-6">
				<div class="card shadow-sm">
					<div class="card-body p-4">
						<h4 class="mb-3">회원가입</h4>

						<form action="/member/join" method="post" enctype="multipart/form-data">

							<div class="row g-3">
								<!-- 이메일 -->
								<div class="col-md-12">
									<label class="form-label">이메일 <span class="text-danger">*</span></label>
									<div class="input-group">
										<input type="email" class="form-control" name="member_email" placeholder="이메일을 입력하세요" id="emailInput" required>
										<button type="button" class="btn btn-outline-secondary" id="emailCheckBtn">중복확인</button>
									</div>
									<div class="form-text text-danger">가입된 이메일이 있습니다</div>
									<div class="form-text text-danger">이메일 형식이 올바르지 않습니다</div>
								</div>

								<!-- 비밀번호 -->
								<div class="col-md-12">
									<label class="form-label">비밀번호 <span class="text-danger">*</span></label>
									<input type="password" class="form-control" name="member_pass" placeholder="비밀번호를 입력하세요" id="passwordInput" required>
									<small class="text-muted">영문, 숫자, 특수문자 조합 8자 이상</small>
								</div>

								<!-- 비밀번호 확인 -->
								<div class="col-md-12">
									<label class="form-label">비밀번호 확인 <span class="text-danger">*</span></label>
									<input type="password" class="form-control" name="member_pass2" placeholder="비밀번호를 다시 입력하세요" id="passwordConfirmInput" required>
									<div class="form-text text-danger">비밀번호가 일치하지 않습니다</div>
								</div>

								<!-- 닉네임 -->
								<div class="col-12">
									<label class="form-label">닉네임 <span class="text-danger">*</span></label>
									<input type="text" class="form-control" name="nickname" placeholder="모임에서 사용할 닉네임" required>
									<div class="form-text text-danger">2~15자 이내로 입력해주세요</div>
								</div>

								<!-- 활동 지역 -->
								<div class="col-12">
									<label class="form-label">주 활동 지역</label>
									<select class="form-select" name="city">
										<option value="서울">서울</option>
										<option value="경기">경기</option>
										<option value="인천">인천</option>
										<option value="기타">기타</option>
									</select>
								</div>

								<!-- 프로필 이모지 -->
								<div class="col-12">
									<label class="form-label">프로필 이모지 (선택)</label>
									<input type="text" class="form-control" name="avatar_emoji" placeholder="😊" maxlength="2">
									<div class="form-text">이모지 하나로 프로필을 표현해보세요</div>
								</div>

								<!-- 약관 동의 -->
								<div class="col-12">
									<div class="form-check">
										<input class="form-check-input" type="checkbox" id="agreeTerms" required>
										<label class="form-check-label small" for="agreeTerms">
											이용약관 및 개인정보 처리방침에 동의합니다 <span class="text-danger">*</span>
										</label>
									</div>
									<div class="form-check">
										<input class="form-check-input" type="checkbox" id="agreeLocation">
										<label class="form-check-label small" for="agreeLocation">
											위치 정보 수집·이용 동의 (방문 인증 기능 사용 시 필요)
										</label>
									</div>
								</div>
							</div>

							<div class="d-grid mt-4">
								<button type="submit" class="btn btn-brand btn-lg" id="submitBtn">가입하기</button>
							</div>

							<div class="text-center small mt-3">
								이미 계정이 있으신가요? <a href="member_login.html" class="text-decoration-none" style="color:var(--brand);">로그인</a>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</main>

	<footer class="py-4 mt-5">
		<div class="container text-center footer">
			<div class="small">© 2025 모여봄 · 1조 프로젝트</div>
		</div>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
