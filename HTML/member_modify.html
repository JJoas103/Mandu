<!doctype html>
<html lang="ko">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>회원수정</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="css/style.css" rel="stylesheet">
</head>

<body>
	<!-- 헤더 -->
	<nav class="navbar navbar-expand-lg navbar-dark">
		<div class="container">
			<a class="navbar-brand" href="index.html">솔데스크</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="nav">
				<ul class="navbar-nav ms-auto">
					<li class="nav-item"><a class="nav-link" href="board_info.html">마이페이지</a></li>
					<li class="nav-item"><a class="nav-link" href="member_login.html">로그아웃</a></li>
					<li class="nav-item"><a class="nav-link" href="member_login.html">로그인</a></li>
					<li class="nav-item"><a class="nav-link" href="member_join.html">회원가입</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<main class="container my-4">
		<div class="row justify-content-center">
			<div class="col-md-7 col-lg-6">
				<div class="card shadow-sm">
					<div class="card-body p-4">
						<h4 class="mb-3">회원수정</h4>

						<form action="#" method="post" enctype="multipart/form-data">

							<div class="row g-3">
								<div class="col-md-12">
									<label class="form-label">이메일 <span class="text-danger">*</span></label>

									<div class="input-group">
										<input type="email" class="form-control" name="member_email"
											placeholder="이메일을 입력하세요" id="emailInput" readonly value="hong@test.com" />
									</div>
								</div>

								<!-- 비밀번호 -->
								<div class="col-md-12">
									<label class="form-label">비밀번호 <span class="text-danger">*</span></label>
									<input type="password" class="form-control" name="member_pass"
										placeholder="비밀번호를 입력하세요" id="passwordInput" />
									<small class="text-muted">영문, 숫자, 특수문자 조합 8자 이상</small>
									<div class="form-text text-danger">비밀번호가 일치하지 않습니다</div>
								</div>

								<!-- 비밀번호 확인 -->
								<div class="col-md-12">
									<label class="form-label">비밀번호 확인 <span class="text-danger">*</span></label>
									<input type="password" class="form-control" name="member_pass2"
										placeholder="비밀번호를 다시 입력하세요" id="passwordConfirmInput" required>
									<div class="form-text text-danger">비밀번호가 일치하지 않습니다</div>
								</div>

								<!-- 이름 -->
								<div class="col-12">
									<label class="form-label">이름 <span class="text-danger">*</span></label>
									<input type="text" class="form-control" name="member_name"
										placeholder="이름을 입력하세요" value="홍길동" />
									<div class="form-text text-danger">한글 이름만 가입이 가능합니다</div>
								</div>

								<!-- 주소 -->
								<div class="col-12">
									<label class="form-label">주소</label>
									<input type="text" class="form-control" name="member_address"
										placeholder="주소를 입력하세요" value="서울시 어딘가" />
								</div>

								<!-- 프로필 이미지 -->
								<div class="col-12">
									<label class="form-label">프로필 이미지</label>
									<input type="file" class="form-control" accept="image/*" name="upload_file">
								</div>
							</div>

							<div class="d-grid mt-4">
								<button type="submit" class="btn btn-brand" id="submitBtn">수정하기</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</main>

	<footer class="py-5 mt-5">
		<div class="container text-center footer">
			<div class="small">© 2025 솔데스크 커뮤니티 게시판</div>
		</div>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
