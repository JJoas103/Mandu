<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>로그인 - 모여봄</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="css/style.css" rel="stylesheet">
</head>
<body>

	<!-- 헤더 -->
	<nav class="navbar navbar-expand-lg">
		<div class="container">
			<a class="navbar-brand" href="index.html">🌿 모여봄</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="nav">
				<ul class="navbar-nav me-auto">
					<li class="nav-item"><a class="nav-link" href="index.html">지도 탐색</a></li>
					<li class="nav-item"><a class="nav-link" href="meeting_list.html">모임 게시판</a></li>
					<li class="nav-item"><a class="nav-link" href="feed_list.html">실시간 제보</a></li>
				</ul>
				<ul class="navbar-nav ms-auto">
					<li class="nav-item"><a class="nav-link" href="member_info.html">마이페이지</a></li>
					<li class="nav-item"><a class="nav-link" href="member_login.html">로그아웃</a></li>
					<li class="nav-item"><a class="nav-link active" href="member_login.html">로그인</a></li>
					<li class="nav-item"><a class="nav-link" href="member_join.html">회원가입</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<main class="container my-4">
		<div class="row justify-content-center">
			<div class="col-md-6 col-lg-5">
				<div class="card shadow-sm">
					<div class="card-body p-4">
						<div class="text-center mb-4">
							<div style="font-size:48px;">🌿</div>
							<h4 class="mt-2">모여봄 로그인</h4>
							<p class="text-muted small">모임 만들기·참여·제보 시 로그인이 필요합니다</p>
						</div>

						<form action="/member/login" method="post">
							<div class="mb-3">
								<label for="member_email" class="form-label">이메일</label>
								<input type="email" class="form-control" name="member_email" id="member_email" placeholder="이메일을 입력하세요" required>
							</div>
							<div class="mb-3">
								<label for="member_pass" class="form-label">비밀번호</label>
								<input type="password" class="form-control" name="member_pass" id="member_pass" placeholder="비밀번호를 입력하세요" required>
							</div>

							<div class="form-check mb-3">
								<input class="form-check-input" type="checkbox" id="rememberMe" name="remember">
								<label class="form-check-label small" for="rememberMe">로그인 상태 유지</label>
							</div>

							<div class="d-grid gap-2 mb-3">
								<button type="submit" class="btn btn-brand btn-lg">로그인</button>
							</div>

							<div class="text-center small">
								<a href="#" class="text-decoration-none text-muted">비밀번호 찾기</a>
								<span class="text-muted">·</span>
								<a href="member_join.html" class="text-decoration-none" style="color:var(--brand);">회원가입</a>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</main>

	<footer class="py-4 mt-5">
		<div class="container text-center footer">
			<div class="small">© 2025 모여봄 · 1조 프로젝트</div>
		</div>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
