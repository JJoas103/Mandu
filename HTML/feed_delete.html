<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>제보 삭제 - 모여봄</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="/css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg">
	<div class="container">
		<a class="navbar-brand" href="/">🌿 모여봄</a>
	</div>
</nav>

<main class="container my-4">
	<div class="row justify-content-center">
		<div class="col-lg-7">
			<div class="card shadow-sm">
				<div class="card-body p-4">
					<h4 class="mb-3 text-danger">제보 삭제</h4>
					<p class="text-muted">아래 제보를 정말 삭제하시겠습니까?</p>

					<div id="feedPreview" class="border rounded p-3 mb-4">
						제보 정보를 불러오는 중입니다...
					</div>

					<form action="/feed/delete" method="post">
						<input type="hidden" name="feed_id" id="feed_id">
						<div class="d-flex gap-2">
							<button type="submit" class="btn btn-danger btn-lg">삭제하기</button>
							<a id="cancelBtn" class="btn btn-outline-secondary btn-lg" href="/feed">취소</a>
						</div>
					</form>

				</div>
			</div>
		</div>
	</div>
</main>

<script>
	function getFeedId() {
		return new URLSearchParams(window.location.search).get('feed_id');
	}

	function escapeHtml(text) {
		return String(text || '')
			.replaceAll('&', '&amp;')
			.replaceAll('<', '&lt;')
			.replaceAll('>', '&gt;')
			.replaceAll('"', '&quot;')
			.replaceAll("'", '&#039;');
	}

	async function loadFeed() {
		const feedId = getFeedId();

		if (!feedId) {
			alert('제보 ID가 없습니다.');
			location.href = '/feed';
			return;
		}

		const response = await fetch(`/feed/api/${feedId}`);
		const result = await response.json();

		if (!result.success) {
			alert('제보를 찾을 수 없습니다.');
			location.href = '/feed';
			return;
		}

		const feed = result.feed;

		document.getElementById('feed_id').value = feed._id;
		document.getElementById('cancelBtn').href = `/feed/info?feed_id=${feed._id}`;

		document.getElementById('feedPreview').innerHTML = `
			<div class="mb-2">
				<span class="badge bg-success">${escapeHtml(feed.category)}</span>
				<span class="badge bg-secondary">${escapeHtml(feed.place_name)}</span>
			</div>
			<p class="mb-0">${escapeHtml(feed.content)}</p>
		`;
	}

	loadFeed();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
